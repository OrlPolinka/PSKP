<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Форма для отправки</h1>
    <form method="post" action="/">
        <label>От кого: <input type="email" name="from" required></label><br><br>
        <label>Кому: <input type="email" name="to" required></label><br><br>
        <label>Сообщение: <br>
            <textarea name="message" rows="6" cols="40" required></textarea>
        </label><br><br>
        <button type="submit">Отправить</button>
    </form>
</body>
</html>
